<!DOCTYPE html>
<html>
    <head>
        <title>Animertion</title>
        <style> 
        .box1 
        {
            width: 500px;
            height: 300px;
            background-color: aqua;
            transition-delay: 500ms;
            transition-duration: 500ms;
            transition-timing-function: linear;
            transition-property: all;
        }
        
        .box1:hover
        {
            
            transform: rotate(100deg) ;
        }
        </style>
    </head>

    <body>
        <div class="box1" >

        </div>

    </body>
</html>
